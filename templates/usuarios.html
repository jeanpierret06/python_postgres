{% extends 'base.html' %}
{% block content %}
<h1>Consulta de Información</h1>
<table border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Email</th>
        </tr>
    </thead>
    <tbody>
        {% for usuario in usuarios %}
        <tr>
            <td>{{ usuario.id }}</td>
            <td>{{ usuario.nombre }}</td>
            <td>{{ usuario.email }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
