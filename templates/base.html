<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compuedu | Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght=0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #141414;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --accent: #c5a880; 
            --accent-hover: #b3966e;
            --border: #242424;
        }

        /* PANTALLA DE CARGA (PRELOADER) */
        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: #050505; /* Negro absoluto más profundo */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999; /* Por encima de cualquier componente */
            transition: opacity 1s cubic-bezier(0.25, 1, 0.5, 1), visibility 1s;
        }

        .preloader-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: var(--text-main);
            letter-spacing: 14px;
            text-transform: uppercase;
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeInText 1.2s forwards 0.3s;
        }

        .preloader-subtitle {
            font-family: 'Playfair Display', serif;
            font-size: 0.85rem;
            color: var(--accent);
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeInSubtitle 2.5s infinite ease-in-out 1.2s;
        }

        /* Animaciones de entrada de texto */
        @keyframes fadeInText {
            to {
                opacity: 1;
                letter-spacing: 16px; /* Efecto sutil de expansión */
            }
        }

        @keyframes fadeInSubtitle {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 1; }
        }

        /* Clase contenedora que activa la salida */
        #preloader.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* EVITAR SCROLL MIENTRAS CARGA */
        body.loading {
            overflow: hidden;
        }

        /* RESTO DE ESTILOS GENERALES */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 40px;
            background-color: rgba(13, 13, 13, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            z-index: 1000;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--text-main);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 400;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--text-main);
        }

        .btn-nav {
            background-color: transparent;
            color: var(--text-main) !important;
            border: 1px solid var(--text-main);
            padding: 8px 18px;
            font-size: 0.8rem !important;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease !important;
        }

        .btn-nav:hover {
            background-color: var(--text-main);
            color: var(--bg-color) !important;
        }

        main {
            padding-top: 80px; 
            min-height: 100vh;
        }
    </style>
</head>
<body class="loading"> <!-- Inicia bloqueando el scroll -->

    <!-- CONTENEDOR ANMACIÓN DE CARGA -->
    <div id="preloader">
        <div class="preloader-title">COMPUEDU</div>
        <div class="preloader-subtitle">Preparando una experiencia excepcional</div>
    </div>

    <header>
        <a href="{{ url_for('index') }}" class="logo">COMPUEDU</a>
        <nav class="nav-links">
            <a href="{{ url_for('index') }}">Inicio</a>
            <a href="{{ url_for('usuarios') }}">Servicios</a>
            <a href="#">Sobre Nosotros</a>
            <a href="{{ url_for('registro') }}" class="btn-nav">Consultar</a>
        </nav>
    </header>

    <main>
        {% block content %} {% endblock %}
    </main>

    <!-- CONTROLADOR JAVASCRIPT DE SALIDA -->
    <script>
        window.addEventListener('load', function() {
            const preloader = document.getElementById('preloader');
            
            // Mantenemos la pantalla visible un breve instante para apreciar la animación
            setTimeout(function() {
                preloader.classList.add('fade-out');
                document.body.classList.remove('loading');
            }, 1400); // 1.4 segundos de retraso controlado
        });
    </script>
</body>
</html>

{% extends 'base.html' %}
{% block content %}
